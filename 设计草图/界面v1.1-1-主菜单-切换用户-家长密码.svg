  <text x="580" y="252" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">忘记密码怎么办？</text>
  <text x="580" y="270" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">删除软件旁的用户配置文件即可重置</text>
  <text x="100" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">① 主菜单（新增用户条）</text>
