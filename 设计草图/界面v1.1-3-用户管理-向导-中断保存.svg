<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>v1.1 界面设计：用户管理、首次运行向导、中断保存对话框</title>
  <desc>家长的用户管理页；首次运行两步向导；答题中途关闭时的保存部分成绩三选对话框</desc>
  <rect x="0.5" y="0.5" width="199" height="349" rx="10" fill="#FFFFFF" stroke="#B4B2A9"/>
  <path d="M10,1 H190 A9,9 0 0 1 199,10 V30 H1 V10 A9,9 0 0 1 10,1 Z" fill="#F1EFE8"/>
  <text x="100" y="20" text-anchor="middle" font-size="11" fill="#444441" font-family="sans-serif">用户管理</text>
  <path d="M190,12 L196,18 M196,12 L190,18" stroke="#888780" stroke-width="1.2"/>
  <rect x="12" y="44" width="176" height="36" rx="8" fill="#F1EFE8"/>
  <circle cx="30" cy="57" r="5" fill="#EF9F27"/>
  <path d="M22,72 A8,8 0 0 1 38,72 Z" fill="#EF9F27"/>
  <text x="44" y="66" font-size="13" font-weight="500" fill="#26215C" font-family="sans-serif">王一</text>
  <text x="98" y="66" font-size="11" fill="#854F0B" font-family="sans-serif">家长</text>
  <rect x="148" y="53" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="163" y="66" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">删</text>
  <rect x="12" y="88" width="176" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="30" cy="101" r="5" fill="#378ADD"/>
  <path d="M22,116 A8,8 0 0 1 38,116 Z" fill="#378ADD"/>
  <text x="44" y="110" font-size="13" font-weight="500" fill="#26215C" font-family="sans-serif">王二</text>
  <text x="98" y="110" font-size="11" fill="#185FA5" font-family="sans-serif">学生</text>
  <rect x="148" y="97" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#A32D2D"/>
  <text x="163" y="110" text-anchor="middle" font-size="11" fill="#A32D2D" font-family="sans-serif">删</text>
  <rect x="12" y="132" width="176" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <circle cx="30" cy="145" r="5" fill="#378ADD"/>
  <path d="M22,160 A8,8 0 0 1 38,160 Z" fill="#378ADD"/>
  <text x="44" y="154" font-size="13" font-weight="500" fill="#26215C" font-family="sans-serif">王三</text>
  <text x="98" y="154" font-size="11" fill="#185FA5" font-family="sans-serif">学生</text>
  <rect x="148" y="141" width="30" height="18" rx="4" fill="#FFFFFF" stroke="#A32D2D"/>
  <text x="163" y="154" text-anchor="middle" font-size="11" fill="#A32D2D" font-family="sans-serif">删</text>
  <rect x="20" y="186" width="75" height="32" rx="8" fill="#378ADD"/>
  <text x="57" y="206" text-anchor="middle" font-size="11" font-weight="500" fill="#FFFFFF" font-family="sans-serif">添加用户</text>
  <rect x="105" y="186" width="75" height="32" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="142" y="206" text-anchor="middle" font-size="11" fill="#444441" font-family="sans-serif">修改密码</text>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">不能删除自己</text>
  <text x="100" y="264" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">至少保留一名家长</text>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">删除用户将同时删除其历史</text>
  <rect x="55" y="302" width="90" height="28" rx="8" fill="#F1EFE8" stroke="#B4B2A9"/>
  <text x="100" y="320" text-anchor="middle" font-size="11" fill="#444441" font-family="sans-serif">返回</text>
  <rect x="240.5" y="0.5" width="199" height="349" rx="10" fill="#FFFFFF" stroke="#B4B2A9"/>
  <path d="M250,1 H430 A9,9 0 0 1 439,10 V30 H241 V10 A9,9 0 0 1 250,1 Z" fill="#F1EFE8"/>
  <text x="340" y="20" text-anchor="middle" font-size="11" fill="#444441" font-family="sans-serif">首次使用向导</text>
  <path d="M430,12 L436,18 M436,12 L430,18" stroke="#888780" stroke-width="1.2"/>
  <text x="340" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#444441" font-family="sans-serif">第 1 步 / 共 2 步：创建家长</text>
  <text x="258" y="92" font-size="11" fill="#888780" font-family="sans-serif">家长姓名</text>
  <rect x="258" y="100" width="164" height="28" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="266" y="118" font-size="12" fill="#26215C" font-family="sans-serif">王一</text>
  <text x="258" y="150" font-size="11" fill="#888780" font-family="sans-serif">设置密码（4-6 位数字）</text>
  <rect x="258" y="158" width="164" height="28" rx="6" fill="#FFFFFF" stroke="#378ADD" stroke-width="1.5"/>
  <text x="266" y="177" font-size="12" fill="#26215C" font-family="sans-serif">● ● ● ●</text>
  <text x="258" y="208" font-size="11" fill="#888780" font-family="sans-serif">再输一遍密码</text>
  <rect x="258" y="216" width="164" height="28" rx="6" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="266" y="235" font-size="12" fill="#26215C" font-family="sans-serif">● ● ● ●</text>
  <rect x="290" y="262" width="100" height="34" rx="8" fill="#378ADD"/>
  <text x="340" y="284" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">下一步</text>
  <text x="340" y="318" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">下一步：创建孩子用户</text>
  <rect x="480.5" y="0.5" width="199" height="349" rx="10" fill="#FFFFFF" stroke="#B4B2A9"/>
  <path d="M490,1 H670 A9,9 0 0 1 679,10 V30 H481 V10 A9,9 0 0 1 490,1 Z" fill="#F1EFE8"/>
  <text x="580" y="20" text-anchor="middle" font-size="11" fill="#444441" font-family="sans-serif">提示</text>
  <path d="M670,12 L676,18 M676,12 L670,18" stroke="#888780" stroke-width="1.2"/>
  <text x="580" y="72" text-anchor="middle" font-size="13" font-weight="500" fill="#26215C" font-family="sans-serif">本次答题还没结束</text>
  <text x="580" y="96" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">已答 12 题（对 10 题）</text>
  <text x="580" y="118" text-anchor="middle" font-size="12" fill="#444441" font-family="sans-serif">要保存这次的部分成绩吗？</text>
  <rect x="505" y="140" width="150" height="34" rx="8" fill="#639922"/>
  <text x="580" y="162" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">保存并退出</text>
  <rect x="505" y="182" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="580" y="204" text-anchor="middle" font-size="13" fill="#444441" font-family="sans-serif">直接退出</text>
  <rect x="505" y="224" width="150" height="34" rx="8" fill="#378ADD"/>
  <text x="580" y="246" text-anchor="middle" font-size="13" font-weight="500" fill="#FFFFFF" font-family="sans-serif">继续答题</text>
  <text x="580" y="286" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">保存后按已答题数计算正确率</text>
  <text x="580" y="304" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">历史里会标记「中途退出」</text>
  <text x="100" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">⑥ 用户管理（家长）</text>
  <text x="340" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">⑦ 首次运行向导</text>
  <text x="580" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">⑧ 中断保存对话框</text>
</svg>
