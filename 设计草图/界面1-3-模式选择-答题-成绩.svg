  <text x="340" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">② 答题界面</text>
  <text x="580" y="378" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">③ 成绩结果</text>
