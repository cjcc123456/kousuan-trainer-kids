  <rect x="588" y="253" width="84" height="36" rx="8" fill="#FFFFFF" stroke="#B4B2A9"/>
  <text x="630" y="276" text-anchor="middle" font-size="13" fill="#444441" font-family="sans-serif">返回菜单</text>
