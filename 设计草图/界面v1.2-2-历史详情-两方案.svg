<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>v1.2 界面设计：历史详情弹窗的两个方案</title>
  <desc>左：方案B 仅汇总统计；右：方案A 汇总 + 错题列表 + 重练本次错题按钮</desc>
  <rect x="15.5" y="0.5" width="319" height="349" rx="10" fill="#FFFFFF" stroke="#B4B2A9"/>
