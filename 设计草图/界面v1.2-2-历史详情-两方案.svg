  <text x="505" y="270" text-anchor="middle" font-size="11" fill="#888780" font-family="sans-serif">重练成绩不计入历史</text>
  <text x="175" y="372" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">⑪ 历史详情-仅汇总（方案B）</text>
  <text x="505" y="372" text-anchor="middle" font-size="13" fill="#B4B2A9" font-family="sans-serif">⑫ 历史详情-含错题+重练（方案A）</text>
